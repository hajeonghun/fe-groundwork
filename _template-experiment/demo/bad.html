  body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; line-height: 1.6; }
  .panel { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  #stage { margin-top: 16px; }
  #log { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: pre-wrap; }

<body>

<h1>{{TOPIC}} — bad</h1>

<div class="panel">
  <p><strong>확인할 문제:</strong> <!-- 한 줄로 --></p>
  <p><strong>측정 방법:</strong> <!-- 어떤 패널의 어떤 지표 --></p>
</div>

<div class="panel">
  <button id="run">실행</button>
  <div id="log"></div>
</div>

<div id="stage"></div>

<script>
// ── 측정 하네스 (필요한 것만 쓰고 나머지는 지운다) ──────────────

const log = (msg) => {
  document.getElementById('log').textContent += msg + '\n';
  console.log(msg);
};

/** 구간 소요 시간 측정. Performance 패널에도 마커로 표시된다. */
function measure(name, fn) {
  performance.mark(`${name}-start`);
  const result = fn();
  performance.mark(`${name}-end`);
  const m = performance.measure(name, `${name}-start`, `${name}-end`);
  log(`${name}: ${m.duration.toFixed(2)}ms`);
  return result;
}

/** 프레임 드랍 관찰용. 지정 시간 동안 FPS를 센다. */
function watchFPS(seconds = 3) {
  let frames = 0;
  const start = performance.now();
  return new Promise((resolve) => {
    const tick = () => {
      frames++;
      if (performance.now() - start < seconds * 1000) {
        requestAnimationFrame(tick);
      } else {
        const fps = frames / seconds;
        log(`평균 FPS: ${fps.toFixed(1)}`);
        resolve(fps);
      }
    };
    requestAnimationFrame(tick);
  });
}

// ── 실험 코드 ─────────────────────────────────────────────────

document.getElementById('run').addEventListener('click', () => {
  document.getElementById('log').textContent = '';

  // TODO: 여기에 문제가 있는 코드
});

</script>
